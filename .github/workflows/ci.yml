name: simulate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  iverilog:
    runs-on: ubuntu-24.04      # pinned: keeps CI's iverilog aligned with local v12
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      - name: List testbenches
        run: scripts/test-all.sh --list

      - name: Run all testbenches
        run: scripts/test-all.sh

name: simulate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  iverilog:
    runs-on: ubuntu-24.04      # pinned: keeps CI's iverilog aligned with local v12
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      # Invoked via `bash` on purpose: this repo is authored on Windows, where
      # core.filemode=false means a local `chmod +x` is never recorded in git.
      # Calling bash explicitly makes CI independent of the executable bit.
      - name: List testbenches
        run: bash scripts/test-all.sh --list

      - name: Run all testbenches
        run: bash scripts/test-all.sh
